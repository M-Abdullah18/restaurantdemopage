<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Demo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="bg-black text-white m-0 p-0">

    <!-- Hero Section with Scroll-Synced Video Container -->
    <div id="hero-container" class="relative h-[300vh]">
        <div class="sticky top-0 h-screen w-full overflow-hidden flex items-center justify-center">
            <video 
                id="scroll-video" 
                muted 
                playsinline 
                webkit-playsinline 
                preload="auto" 
                style="will-change: transform; transform: translateZ(0);"
                class="w-full h-full object-cover opacity-50 absolute inset-0">
                <source src="https://github.com/M-Abdullah18/restaurantdemo/raw/refs/heads/main/demo.mp4" type="video/mp4">
            </video>
            
            <!-- Hero Content -->
            <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-4 z-10">
                <h1 class="text-4xl md:text-6xl font-bold mb-4">Welcome to Our Restaurant</h1>
                <p class="text-lg md:text-2xl text-gray-300">Experience the best taste and luxury</p>
            </div>
        </div>
    </div>

    <!-- Rest of your website content -->
    <div class="min-h-screen bg-neutral-900 flex items-center justify-center relative z-20">
        <h2 class="text-3xl font-semibold">Our Menu & Specialties</h2>
    </div>

    <script>
        const video = document.getElementById('scroll-video');
        const heroContainer = document.getElementById('hero-container');

        let targetTime = 0;
        let currentTime = 0;

        // Ensure video metadata is loaded
        video.addEventListener('loadedmetadata', () => {
            console.log("Video duration loaded:", video.duration);
        });

        window.addEventListener('scroll', () => {
            const rect = heroContainer.getBoundingClientRect();
            const containerHeight = heroContainer.offsetHeight - window.innerHeight;
            
            // Calculate scroll progress specifically inside the hero container
            let scrollProgress = -rect.top / containerHeight;
            scrollProgress = Math.max(0, Math.min(1, scrollProgress)); // Clamp between 0 and 1

            if (video.duration) {
                targetTime = scrollProgress * video.duration;
            }
        });

        // Smooth 60fps render loop using requestAnimationFrame
        function render() {
            currentTime += (targetTime - currentTime) * 0.1; // Smooth interpolation
            if (Math.abs(targetTime - currentTime) > 0.001) {
                video.currentTime = currentTime;
            }
            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>
